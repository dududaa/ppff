name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # fromJSON(matrix.container): the manylinux_2_28 image for linux
    # (glibc 2.28 floor), null for macOS (runs on the host directly).
    container: ${{ fromJSON(matrix.container) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linux build runs inside a manylinux_2_28 container so
          # every shipped .so has a glibc 2.28 floor: AlmaLinux/RHEL 8+
          # (2.28), Debian 10+ (2.28), Ubuntu 20.04+ (2.31) — including
          # hosts older than the ubuntu-22.04 runner itself (2.35), which
          # the previous floor excluded (AlmaLinux 9 = 2.34 could not
          # load the v0.3.1 runtime).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            cache_key: bundled-ffmpeg-glibc228-linux-x86_64
            container: '{"image": "quay.io/pypa/manylinux_2_28_x86_64"}'
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            cache_key: bundled-ffmpeg-macos-aarch64
            container: 'null'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64
            cache_key: bundled-ffmpeg-macos-x86_64
            container: 'null'
          # Windows is temporarily excluded: its Verify step still
          # rejects the plugin export check. Re-enable for a later
          # release together with the fix (Windows runners cannot run
          # job containers, hence container: 'null').
          # - os: windows-latest
          #   target: x86_64-pc-windows-gnu
          #   os_name: windows
          #   arch: x86_64
          #   cache_key: bundled-ffmpeg-windows-x86_64
          #   container: 'null'
    steps:
      - uses: actions/checkout@v4

      # Linux runs in the manylinux_2_28 container: most tools are
      # already there, pull only what the image lacks (EPEL covers
      # patchelf). Fail loudly if a required tool is still missing.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          have() { command -v "$1" >/dev/null 2>&1; }
          need=()
          have gcc || need+=(gcc)
          have g++ || need+=(gcc-c++)
          have make || need+=(make)
          have cmake || need+=(cmake)
          have nasm || need+=(nasm)
          have yasm || need+=(yasm)
          have patchelf || need+=(patchelf)
          have pkg-config || need+=(pkgconf-pkg-config)
          have perl || need+=(perl)
          have tar || need+=(tar)
          have xz || need+=(xz)
          have gzip || need+=(gzip)
          have curl || need+=(curl)
          have git || need+=(git)
          have file || need+=(file)
          have which || need+=(which)
          if [ "${#need[@]}" -gt 0 ]; then
            dnf install -y epel-release || true
            dnf install -y "${need[@]}"
          fi
          # Prefer the gcc-toolset compiler: newer than the system gcc,
          # still linked against the container's glibc 2.28.
          if [ -d /opt/rh/gcc-toolset-12/root/usr/bin ]; then
            echo /opt/rh/gcc-toolset-12/root/usr/bin >> "$GITHUB_PATH"
          fi
          for t in gcc g++ make cmake nasm yasm patchelf pkg-config perl curl git; do
            command -v "$t" >/dev/null || { echo "missing required tool: $t" >&2; exit 1; }
          done

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm yasm cmake pkg-config

      - name: Install Rust (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust (Windows/GNU host)
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Install build tools (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-toolchain `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-nasm `
            mingw-w64-x86_64-yasm `
            mingw-w64-x86_64-cmake `
            tar curl make perl

      - name: Cache bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/ppff-ffmpeg
            ~/ppff-ffmpeg-work/downloads
          # The workflow file is part of the key: container/toolchain
          # changes in it must not silently reuse a stale build. The linux
          # cache_key prefix (glibc228) never matches the pre-container
          # caches, so linux always rebuilds inside the manylinux image.
          key: ${{ matrix.cache_key }}-${{ hashFiles('scripts/build-ffmpeg-static.sh', '.github/workflows/release.yml') }}
          restore-keys: |
            ${{ matrix.cache_key }}-

      - name: Build bundled FFmpeg runtime (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./scripts/build-ffmpeg-static.sh

      - name: Build bundled FFmpeg runtime (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: C:\msys64\usr\bin\bash.exe {0}
        run: |
          set -euo pipefail
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          ./scripts/build-ffmpeg-static.sh

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: cargo build --release --locked --workspace

      - name: Build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          export CARGO_TARGET_X86_64_UNKNOWN_WINDOWS_GNU_LINKER=gcc
          cargo build --release --locked --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          os="${{ matrix.os_name }}"
          arch="${{ matrix.arch }}"

          if [ "$os" = "windows" ]; then
            lib_ext="dll"
            prefix=""
          elif [ "$os" = "macos" ]; then
            lib_ext="dylib"
            prefix="lib"
          else
            lib_ext="so"
            prefix="lib"
          fi

          mv "target/release/${prefix}image_conversion.${lib_ext}" \
            "ppdrive-image-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}image_transformation.${lib_ext}" \
            "ppdrive-image-transformation-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}audio_conversion.${lib_ext}" \
            "ppdrive-audio-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}audio_effects.${lib_ext}" \
            "ppdrive-audio-effects-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}video_conversion.${lib_ext}" \
            "ppdrive-video-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}video_transformation.${lib_ext}" \
            "ppdrive-video-transformation-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}media_streaming.${lib_ext}" \
            "ppdrive-media-streaming-${os}-${arch}.${lib_ext}"

          # The shared FFmpeg runtime: one bundle per platform that the
          # plugin installer extracts into ppdrive's libs/ directory.
          cp "${PPDRIVE_FFMPEG_RUNTIME_TAR:?runtime bundle missing}" .
          ls -la ppdrive-*

      - name: Verify plugins and runtime are relocatable
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          fi
          fail=0
          err() { echo "ERROR: $*" >&2; fail=1; }

          # The linux build must stay loadable on glibc 2.28+ hosts
          # (AlmaLinux/RHEL 8, Debian 10, Ubuntu 20.04 — e.g. the
          # AlmaLinux 9 production host that could not load the 2.35-floor
          # v0.3.1 runtime): no shipped .so may require a newer GLIBC_
          # versioned symbol than 2.28.
          check_glibc_floor() {
            [ "$RUNNER_OS" = "Linux" ] || return 0
            local max v
            max="$(objdump -T "$1" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true)"
            [ -n "$max" ] || return 0
            v="${max#GLIBC_}"
            if [ "$(printf '%s\n' 2.28 "$v" | sort -uV | tail -1)" != "2.28" ]; then
              err "$1 requires $max (glibc floor must stay <= 2.28)"
            fi
          }

          # Emit one bare dependency name per line.
          needs_of() {
            case "$1" in
            *.so) readelf -d "$1" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' ;;
            *.dylib)
              # otool -L prints the file header, then the LC_ID_DYLIB, then
              # the real dependency load commands; drop the first two.
              id="$(otool -D "$1" | sed -n '2p')"
              otool -L "$1" | tail -n +2 | awk '{print $1}' | grep -vxF "$id"
              ;;
            *.dll) objdump -p "$1" | sed -n 's/.*DLL Name: //p' ;;
            esac
          }

          # Codecs and host C/C++ runtimes that must never appear as a
          # dependency: everything here is either bundled *inside* the
          # runtime's dylibs or belongs to a host we must not require.
          deny_re='libx264|libx265|libvpx|libaom|libwebp|libmp3lame|libvorbis|libopus|libogg|libz\.so|zlib1|libX11|libxcb|libbz2|liblzma|libstdc\+\+|libgcc_s|libgcc_eh|libwinpthread'
          system_re='^libc\.so|^libm\.so|^libmvec|^libpthread|^libdl|^librt\.so|^ld-linux|^ld64|^libSystem|^kernel32|^msvcrt|^ntdll|^user32|^advapi32|^shell32|^ws2_32|^ucrtbase|^vcruntime|^api-ms-win|^bcrypt|^ole32|^shlwapi|^winmm|^psapi|^version|^crypt32|^ncrypt|^secur32|^userenv|^combase'

          # Deps allowed in shipped artifacts: the bundled runtime's own
          # six libraries (plugins reference them; the runtime references
          # itself), known OS libraries, and on macOS anything the platform
          # owns under /usr/lib (dyld shared cache) or
          # /System/Library/Frameworks (AVFoundation, AudioToolbox, ...).
          allowed_dep() {
            local dep="$1"
            case "$dep" in
            *libav* | *libsw* | avcodec-* | avformat-* | avutil-* | avfilter-* | swscale-* | swresample-*)
                return 0
                ;;
            esac
            if [ "$RUNNER_OS" = "macOS" ]; then
                case "$dep" in
                /usr/lib/* | /System/Library/*) return 0 ;;
                esac
            fi
            echo "$dep" | grep -Eiq "$system_re"
          }

          # --- runtime bundle: six FFmpeg libraries, OS deps only ---
          mkdir -p runtime-check
          tar -xzf ppdrive-media-runtime-*.tar.gz -C runtime-check
          count="$(find runtime-check -type f | wc -l)"
          [ "$count" -eq 6 ] || err "runtime bundle has $count files, expected 6"
          echo "== runtime bundle contents"
          ls -la runtime-check
          for f in runtime-check/*; do
            echo "== runtime $(basename "$f")"
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              echo "  needs: $dep"
              if echo "$dep" | grep -Eiq "$deny_re"; then
                err "runtime $(basename "$f") depends on $dep"
              elif ! allowed_dep "$dep"; then
                err "runtime $(basename "$f") has unexpected dep $dep"
              fi
            done < <(needs_of "$f")
            check_glibc_floor "$f"
            if [ "$RUNNER_OS" = "macOS" ] && otool -L "$f" | grep -q "ppff-ffmpeg"; then
              err "runtime $(basename "$f") records a build-time path"
            fi
          done

          # --- plugins: bind to the bundled runtime, export only the
          # ppdrive entry point, carry no FFmpeg code of their own ---
          for f in ppdrive-*; do
            case "$f" in
            *.so | *.dylib | *.dll) ;;
            *) continue ;;
            esac
            echo "== plugin $f"
            has_av=0
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              echo "  needs: $dep"
              case "$dep" in
              *libav* | *libsw* | avcodec-* | avformat-* | avutil-* | avfilter-* | swscale-* | swresample-*)
                has_av=1
                ;;
              esac
              if echo "$dep" | grep -Eiq "$deny_re"; then
                err "plugin $f depends on $dep"
              elif ! allowed_dep "$dep"; then
                err "plugin $f has unexpected dep $dep"
              fi
            done < <(needs_of "$f")
            [ "$has_av" -eq 1 ] || err "plugin $f has no FFmpeg runtime dependency"
            size="$(wc -c <"$f")"
            if [ "$size" -gt 15728640 ]; then
              err "plugin $f is $size bytes (>15 MiB): FFmpeg got linked in?"
            fi
            case "$f" in
            *.so)
              syms="$(readelf --dyn-syms -W "$f" | grep -v ' UND ' || true)"
              echo -n "  highest GLIBC symbol version: "
              objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true
              check_glibc_floor "$f"
              ;;
            *.dylib)
              syms="$(nm -gU "$f" || true)"
              if otool -L "$f" | grep -q "ppff-ffmpeg"; then
                err "plugin $f records a build-time path"
              fi
              ;;
            *.dll)
              # nm reports "no symbols" on stripped DLLs. Read objdump -p's
              # export name table instead: entry lines are the only lines of
              # the form "[ N] identifier" (imported names appear as
              # "vma ordinal name" and are excluded by the end anchor), so
              # this is export-only — plugins legitimately import
              # avcodec_open2.
              syms="$(objdump -p "$f" | grep -E '^[[:space:]]*\[[0-9 ]+\][[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$' || true)"
              ;;
            esac
            # macOS nm prefixes symbol names with "_", so allow an optional
            # leading underscore (grep -w would reject _plugin_dispatch).
            if ! echo "$syms" | grep -Eq '(^|[^[:alnum:]_])_?plugin_dispatch([^[:alnum:]_]|$)'; then
              err "plugin $f does not export plugin_dispatch"
            fi
            # A defined avcodec_open2 would mean a private FFmpeg copy got
            # linked in (undefined references to it are expected).
            if echo "$syms" | grep -Eq '(^|[^[:alnum:]_])_?avcodec_open2([^[:alnum:]_]|$)'; then
              err "plugin $f defines FFmpeg symbols"
            fi
          done

          # --- dlopen smoke: reproduce ppdrive's load conditions ---
          # The smoke dir mirrors ppdrive's libs/ layout: plugins next to
          # the runtime, resolved via the plugin's own $ORIGIN/@loader_path
          # rpath (and, on Windows, LOAD_WITH_ALTERED_SEARCH_PATH exactly
          # like ppdrive/core's loader).
          mkdir -p smoke
          case "$RUNNER_OS" in
          Windows)
            cp ppdrive-*.dll smoke/
            plugins=(smoke/ppdrive-*.dll)
            ;;
          macOS)
            cp ppdrive-*.dylib smoke/
            plugins=(smoke/ppdrive-*.dylib)
            ;;
          *)
            cp ppdrive-*.so smoke/
            plugins=(smoke/ppdrive-*.so)
            ;;
          esac
          cp runtime-check/* smoke/
          cat >smoke/load.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #ifdef _WIN32
          #include <windows.h>
          static void *load_lib(const char *p) {
            char full[4096];
            if (!GetFullPathNameA(p, sizeof full, full, NULL)) return NULL;
            return (void *)LoadLibraryExA(full, NULL, LOAD_WITH_ALTERED_SEARCH_PATH);
          }
          static void *get_sym(void *h, const char *n) { return (void *)GetProcAddress((HMODULE)h, n); }
          static const char *load_err(void) { static char b[64]; sprintf(b, "win32 error %lu", GetLastError()); return b; }
          #else
          #include <dlfcn.h>
          static void *load_lib(const char *p) { return dlopen(p, RTLD_NOW | RTLD_LOCAL); }
          static void *get_sym(void *h, const char *n) { return dlsym(h, n); }
          static const char *load_err(void) { return dlerror(); }
          #endif
          int main(int argc, char **argv) {
            void *h;
            if (argc < 2) return 2;
            h = load_lib(argv[1]);
            if (!h) { fprintf(stderr, "load failed: %s\n", load_err()); return 1; }
            if (!get_sym(h, "plugin_dispatch")) { fprintf(stderr, "missing plugin_dispatch\n"); return 1; }
            printf("loaded %s ok\n", argv[1]);
          #ifdef __linux__
            if (argc >= 3) {
              int maps = 0;
              char line[4096];
              FILE *m;
              void *h2 = load_lib(argv[2]);
              if (!h2) { fprintf(stderr, "second load failed: %s\n", load_err()); return 1; }
              m = fopen("/proc/self/maps", "r");
              /* Count executable segments: each mapped library instance has
                 exactly one r-xp mapping, so two copies of libavcodec (from
                 two different paths) would report 2. */
              while (m && fgets(line, sizeof line, m))
                if (strstr(line, "libavcodec.so") && strstr(line, " r-xp ")) maps++;
              if (m) fclose(m);
              printf("libavcodec executable mappings with %d plugins loaded: %d\n", argc - 1, maps);
              if (maps != 1) { fprintf(stderr, "expected 1 shared libavcodec mapping, got %d\n", maps); return 1; }
            }
          #endif
            return 0;
          }
          EOF
          extra_ld=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra_ld="-ldl"; fi
          cc_bin="$(command -v cc || command -v gcc || true)"
          if [ -n "$cc_bin" ] && "$cc_bin" -o smoke/load smoke/load.c $extra_ld; then
            if [ "$RUNNER_OS" = "Linux" ] && [ "${#plugins[@]}" -ge 2 ]; then
              ./smoke/load "${plugins[0]}" "${plugins[1]}"
            else
              ./smoke/load "${plugins[0]}"
            fi
          else
            err "smoke loader failed to compile"
          fi
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-audio-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-audio-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-audio-effects-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-audio-effects-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-video-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-video-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-video-transformation-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-video-transformation-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-media-streaming-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-media-streaming-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-media-runtime-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-media-runtime-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ppdrive-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in $(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
