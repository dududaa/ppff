name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor of the shipped plugins at
          # 2.35 so they load on Debian 12 / Ubuntu 22.04+ / RHEL 9 hosts.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            os_name: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Rust (Windows/GNU host)
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config nasm yasm cmake

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm yasm cmake pkg-config

      - name: Install build tools (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -Syu --noconfirm
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-toolchain `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-nasm `
            mingw-w64-x86_64-yasm `
            mingw-w64-x86_64-cmake `
            tar curl make perl

      - name: Cache static FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/ppff-ffmpeg
            ~/ppff-ffmpeg-work/downloads
          key: static-ffmpeg-${{ matrix.os_name }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg-static.sh') }}
          restore-keys: |
            static-ffmpeg-${{ matrix.os_name }}-${{ matrix.arch }}-

      - name: Build static FFmpeg (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./scripts/build-ffmpeg-static.sh

      - name: Build static FFmpeg (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: C:\msys64\usr\bin\bash.exe {0}
        run: |
          set -euo pipefail
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          ./scripts/build-ffmpeg-static.sh

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: cargo build --release --locked --workspace

      - name: Build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          export CARGO_TARGET_X86_64_UNKNOWN_WINDOWS_GNU_LINKER=gcc
          cargo build --release --locked --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          os="${{ matrix.os_name }}"
          arch="${{ matrix.arch }}"

          if [ "$os" = "windows" ]; then
            lib_ext="dll"
            prefix=""
          elif [ "$os" = "macos" ]; then
            lib_ext="dylib"
            prefix="lib"
          else
            lib_ext="so"
            prefix="lib"
          fi

          mv "target/release/${prefix}image_conversion.${lib_ext}" \
            "ppdrive-image-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}image_transformation.${lib_ext}" \
            "ppdrive-image-transformation-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}audio_conversion.${lib_ext}" \
            "ppdrive-audio-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}audio_effects.${lib_ext}" \
            "ppdrive-audio-effects-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}video_conversion.${lib_ext}" \
            "ppdrive-video-conversion-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}video_transformation.${lib_ext}" \
            "ppdrive-video-transformation-${os}-${arch}.${lib_ext}"
          mv "target/release/${prefix}media_streaming.${lib_ext}" \
            "ppdrive-media-streaming-${os}-${arch}.${lib_ext}"
          ls -la ppdrive-*

      - name: Verify plugins are self-contained
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          fi
          fail=0
          for f in ppdrive-*; do
            echo "== $f"
            case "$f" in
              *.so)
                needs="$(readelf -d "$f" | grep NEEDED || true)"
                syms="$(readelf --dyn-syms -W "$f" || true)"
                ;;
              *.dylib)
                needs="$(otool -L "$f" | tail -n +2)"
                syms=""
                ;;
              *.dll)
                needs="$(objdump -p "$f" | grep 'DLL Name' || true)"
                syms=""
                ;;
              *)
                continue
                ;;
            esac
            echo "$needs"
            if echo "$needs" | grep -Eiq \
              'libav|libsw|libx264|libx265|libvpx|libaom|libwebp|libmp3lame|libvorbis|libopus|libogg|libz\.so|zlib1|libstdc\+\+|libgcc_s|libX11|libxcb|libbz2|liblzma|avcodec|avformat|avutil|avfilter|swscale|swresample'; then
              echo "ERROR: $f still depends on external media libraries" >&2
              fail=1
            fi
            if [ -n "$syms" ]; then
              if ! echo "$syms" | grep -qw plugin_dispatch; then
                echo "ERROR: $f does not export plugin_dispatch" >&2
                fail=1
              fi
              if echo "$syms" | grep -qw avcodec_open2; then
                echo "ERROR: $f leaks FFmpeg symbols" >&2
                fail=1
              fi
              # Report the glibc floor (informational; built on 22.04 → ≤2.35).
              echo -n "highest GLIBC symbol version: "
              objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-image-transformation-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-audio-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-audio-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-audio-effects-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-audio-effects-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-video-conversion-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-video-conversion-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-video-transformation-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-video-transformation-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ppdrive-media-streaming-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ppdrive-media-streaming-${{ matrix.os_name }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ppdrive-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in $(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
