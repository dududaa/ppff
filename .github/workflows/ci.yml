name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04-system-ffmpeg-6.1
            os: ubuntu-24.04
          - name: macos-brew-ffmpeg-full
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg-full)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  test-static:
    name: Test (ubuntu-22.04-static-ffmpeg-9)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config nasm yasm cmake
      # Shares the cache with the linux-x86_64 release build: tests run
      # against the exact toolchain the shipped plugins link against.
      - name: Cache static FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/ppff-ffmpeg
            ~/ppff-ffmpeg-work/downloads
          key: static-ffmpeg-linux-x86_64-${{ hashFiles('scripts/build-ffmpeg-static.sh') }}
          restore-keys: |
            static-ffmpeg-linux-x86_64-
      - name: Build static FFmpeg
        run: ./scripts/build-ffmpeg-static.sh
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test against static FFmpeg
        run: cargo test --workspace --all-targets --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  msrv:
    name: MSRV (rustc 1.94.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check at MSRV
        run: cargo check --workspace --all-targets --locked

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-24.04
    env:
      # libx265 leaks a fixed 1168-byte block inside x265_encoder_close
      # (upstream, unreleased fix). Suppress just that module so leaks in
      # our code or the rest of FFmpeg still fail the target.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/video-conversion/fuzz/lsan.supp
    # Fuzzing exercises the FFmpeg libraries themselves; a crash found in
    # upstream FFmpeg code should surface as a visible (but non-blocking)
    # signal rather than gating every pull request. The tolerance lives on
    # each fuzz step so one crashing target cannot skip the ones after it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          cargo install cargo-fuzz --locked
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            audio-conversion/fuzz/target
            audio-effects/fuzz/target
            image-conversion/fuzz/target
            image-transformation/fuzz/target
            video-conversion/fuzz/target
            video-transformation/fuzz/target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fuzz audio-conversion
        working-directory: audio-conversion
        continue-on-error: true
        run: cargo fuzz run fuzz_convert -- -max_total_time=60
      - name: Fuzz audio-effects
        working-directory: audio-effects
        continue-on-error: true
        run: cargo fuzz run fuzz_apply -- -max_total_time=60
      - name: Fuzz image-conversion
        working-directory: image-conversion
        continue-on-error: true
        run: cargo fuzz run fuzz_decode -- -max_total_time=60
      - name: Fuzz image-transformation
        working-directory: image-transformation
        continue-on-error: true
        run: cargo fuzz run fuzz_transform -- -max_total_time=60
      - name: Fuzz video-conversion
        working-directory: video-conversion
        continue-on-error: true
        run: cargo fuzz run fuzz_transcode -- -max_total_time=60
      - name: Fuzz video-transformation
        working-directory: video-transformation
        continue-on-error: true
        run: cargo fuzz run fuzz_edit -- -max_total_time=60
